<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Game</title>
</head>
<body>

</body>
<script type="module">
    import kaboom from "https://unpkg.com/kaboom@3000.0.1/dist/kaboom.mjs";

    kaboom()

    loadSprite("bean", "spritez/bean.png")
    loadSprite("gosti", "spritez/gosti.png")

    const player = add([
        sprite("bean"),
        pos(120, 80),
        rotate(0),
        anchor("center")
    ])

    const x = rand(0, width())
    const y = rand(0, height())

    add([
        sprite("gosti"),
        pos(x, y)
    ])

    document.addEventListener("keydown", function(event) {
        if (event.type == "w") {
            player.x += 120 * dt()
        }
        else if (event.type == "s") {
            player.x -= 120 * dt()
        }
        else if (event.type == "a") {
            player.y += 80 * dt()
        }
        else if (event.type == "d") {
            player.y -= 80 * dt()
        }
    });
</script>
</html>
